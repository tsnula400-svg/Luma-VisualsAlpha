name: Build Luma Visuals (ZIP to JAR)

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          ZIP_NAME="luma-visuals-0.1.6-audit.1-nohurtcam-nofire-gradle-wrapper.zip"

          if [[ ! -f "$ZIP_NAME" ]]; then
            echo "ОШИБКА: в корне репозитория нет файла $ZIP_NAME" >&2
            ls -la
            exit 1
          fi

          echo "Найден архив: $ZIP_NAME"
          sha256sum "$ZIP_NAME"

          rm -rf .luma-src
          mkdir -p .luma-src
          python3 -c "import zipfile; zipfile.ZipFile('$ZIP_NAME').extractall('.luma-src')"

          if [[ -f .luma-src/build.gradle ]]; then
            project="$GITHUB_WORKSPACE/.luma-src"
          else
            sub="$(find .luma-src -mindepth 1 -maxdepth 3 -name build.gradle -print -quit)"
            if [[ -z "$sub" ]]; then
              echo "ОШИБКА: в архиве не найден build.gradle" >&2
              find .luma-src -type f | head -30
              exit 1
            fi
            project="\( (cd " \)(dirname "$sub")" && pwd)"
          fi

          echo "PROJECT_DIR=$project" >> "$GITHUB_ENV"
          echo "Project dir: $project"

          test -f "$project/build.gradle"
          test -f "$project/gradle.properties"
          test -f "$project/src/main/resources/fabric.mod.json"

          # Если в архиве нет gradle-wrapper.jar — скачаем
          if [[ ! -f "$project/gradle/wrapper/gradle-wrapper.jar" ]]; then
            echo "gradle-wrapper.jar отсутствует, скачиваю..."
            mkdir -p "$project/gradle/wrapper"
            curl -sL -o "$project/gradle/wrapper/gradle-wrapper.jar" \
              "https://raw.githubusercontent.com/gradle/gradle/v8.12.0/gradle/wrapper/gradle-wrapper.jar"
          fi

          echo "Структура проекта OK"

      - name: Gradle build
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          chmod +x gradlew || true
          rm -rf build

          # Используем wrapper если есть, иначе системный gradle
          if [[ -f ./gradlew ]]; then
            ./gradlew --no-daemon clean build --stacktrace
          else
            gradle --no-daemon clean build --stacktrace
          fi

          version="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')"
          archive_name="$(sed -n 's/^archives_base_name=//p' gradle.properties | tr -d '\r')"
          jar="build/libs/\( {archive_name}- \){version}.jar"

          echo "Ожидаемый JAR: $jar"
          ls -la build/libs/ || true
          test -s "$jar"

          mkdir -p "$RUNNER_TEMP/luma-artifact"
          cp "$jar" "$RUNNER_TEMP/luma-artifact/"
          echo "BUILD OK: $(basename "$jar")" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: luma-visuals-0.1.6-jar
          path: ${{ runner.temp }}/luma-artifact/*
          if-no-files-found: error
