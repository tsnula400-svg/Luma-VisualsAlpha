name: Build Luma Visuals

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Extract and Build
        run: |
          set -e
          ZIP="luma-visuals-0.1.6-audit.1-nohurtcam-nofire-gradle-wrapper.zip"
          echo "Looking for $ZIP"
          ls -la
          rm -rf src_project
          mkdir src_project
          python3 -c "import zipfile; zipfile.ZipFile('$ZIP').extractall('src_project')"
          BUILD_FILE=$(find src_project -name build.gradle | head -1)
          echo "Found: $BUILD_FILE"
          PROJECT=$(dirname "$BUILD_FILE")
          echo "Project: $PROJECT"
          cd "$PROJECT"
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p gradle/wrapper
            curl -sL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.12.0/gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x gradlew || true
          if [ -f ./gradlew ]; then
            ./gradlew --no-daemon clean build --stacktrace
          else
            gradle --no-daemon clean build --stacktrace
          fi
          echo "=== build/libs ==="
          ls -la build/libs/
          mkdir -p $RUNNER_TEMP/out
          cp build/libs/*.jar $RUNNER_TEMP/out/ || true
          rm -f $RUNNER_TEMP/out/*-sources.jar || true
          ls -la $RUNNER_TEMP/out/

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: luma-jar
          path: ${{ runner.temp }}/out/*.jar
          if-no-files-found: error
