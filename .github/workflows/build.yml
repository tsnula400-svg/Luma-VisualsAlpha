name: Build Lume Visuals

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Find Gradle project
        id: find
        shell: bash
        run: |
          set -euo pipefail
          file="$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/build/*' -not -path '*/.git/*' -not -path '*/.gradle/*' | head -n 1)"
          if [ -z "$file" ]; then
            echo "ERROR: settings.gradle not found. Push the whole project, not only build.yml." >&2
            exit 1
          fi
          dir="$(dirname "$file" | sed 's|^\./||')"
          [ -z "$dir" ] && dir="."
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "Gradle project: $dir"
          ls -la "$dir"

      - name: Ensure build_provenance stub exists
        shell: bash
        run: |
          set -euo pipefail
          project="${{ steps.find.outputs.dir }}"
          if [ ! -f "$project/tools/build_provenance.py" ]; then
            echo "tools/build_provenance.py missing — creating a minimal stub"
            mkdir -p "$project/tools"
            cat > "$project/tools/build_provenance.py" <<'PY'
          #!/usr/bin/env python3
          import argparse, hashlib, json, os

          parser = argparse.ArgumentParser()
          parser.add_argument('--project', required=True)
          parser.add_argument('--output', required=True)
          args = parser.parse_args()

          h = hashlib.sha256()
          for root, dirs, files in os.walk(args.project):
            if any(x in root for x in ['.git', 'build', '.gradle']): continue
            dirs[:] = [d for d in dirs if d not in ['.git', 'build', '.gradle']]
            for f in sorted(files):
              p = os.path.join(root, f)
              try:
                with open(p, 'rb') as fp:
                  h.update(fp.read())
              except Exception:
                pass

          data = {'sourceSha256': h.hexdigest(), 'version': 'ci'}
          os.makedirs(args.output, exist_ok=True)
          with open(os.path.join(args.output, 'luma-build.json'), 'w') as fp:
            json.dump(data, fp)
          with open(os.path.join(args.output, 'luma-build.properties'), 'w') as fp:
            fp.write(f"sourceSha256={data['sourceSha256']}\n")
          PY
            chmod +x "$project/tools/build_provenance.py"
          fi

      - name: Build JAR
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.find.outputs.dir }}"
          rm -rf build
          gradle --no-daemon --no-build-cache --rerun-tasks clean build --stacktrace --console=plain

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: LumeVisuals-${{ github.sha }}
          path: ${{ steps.find.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
