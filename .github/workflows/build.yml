name: Build Luma Visuals (ZIP to JAR)

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Extract luma-src.zip into the workspace
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          if [[ ! -f luma-src.zip ]]; then
            echo 'ОШИБКА: в корне репозитория нет файла luma-src.zip' >&2
            echo 'Загрузи его: главная страница репо, Add file, Upload files, выбрать luma-src.zip, Commit changes.' >&2
            exit 1
          fi
          sha256sum luma-src.zip
          rm -rf .luma-src
          mkdir -p .luma-src
          python3 -c "import zipfile; zipfile.ZipFile('luma-src.zip').extractall('.luma-src')"
          if [[ -f .luma-src/build.gradle ]]; then
            project="$GITHUB_WORKSPACE/.luma-src"
          else
            sub="$(find .luma-src -mindepth 2 -maxdepth 2 -name build.gradle -print -quit)"
            if [[ -z "$sub" ]]; then
              echo 'ОШИБКА: в архиве не найден build.gradle (ни в корне архива, ни в одной подпапке)' >&2
              exit 1
            fi
            project="$(cd "$(dirname "$sub")" && pwd)"
          fi
          echo "PROJECT_DIR=$project" >> "$GITHUB_ENV"
          echo "Project dir: $project"
          test -f "$project/settings.gradle"
          test -f "$project/gradle.properties"
          test -f "$project/src/main/resources/fabric.mod.json"
          test -f "$project/tools/verify_jar.py"
          echo 'Структура проекта OK'

      - name: Offline checks
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 tools/test_javap_normalization.py
          bash tools/check_core.sh "$RUNNER_TEMP/luma-core" 2>&1 | tee "$RUNNER_TEMP/luma-core.log"
          python3 tools/custom_skin_v2/recording_check.py "$RUNNER_TEMP/luma-poses"

      - name: Gradle build and JAR verification
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          rm -rf build
          gradle --no-daemon --no-build-cache --rerun-tasks clean build --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/luma-build.log"
          version="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')"
          archive_name="$(sed -n 's/^archives_base_name=//p' gradle.properties | tr -d '\r')"
          test -n "$version"
          test -n "$archive_name"
          jar="build/libs/${archive_name}-${version}.jar"
          test -s "$jar"
          artifact="$RUNNER_TEMP/luma-artifact"
          rm -rf "$artifact"
          mkdir -p "$artifact"
          python3 tools/verify_jar.py --project . --jar "$jar" --commit "$GITHUB_SHA" --report "$artifact/JAR-VERIFICATION.json"
          cp "$jar" "$artifact/"
          cp build/resources/main/luma-build.json "$artifact/SOURCE-IDENTITY.json"
          cp "$RUNNER_TEMP/luma-core.log" "$RUNNER_TEMP/luma-build.log" "$artifact/"
          (cd "$artifact" && sha256sum "${archive_name}-${version}.jar" > JAR-SHA256SUMS.txt)
          echo "### BUILD OK: ${archive_name}-${version}.jar" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumaVisuals-jar-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/luma-artifact/*
          if-no-files-found: error

      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LumaVisuals-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/luma-core.log
            ${{ runner.temp }}/luma-build.log
          if-no-files-found: ignore
          
