name: Build Luma Visuals (ZIP to JAR)

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          ZIP_NAME="luma-visuals-0.1.6-audit.1-nohurtcam-nofire-gradle-wrapper.zip"

          if [ ! -f "$ZIP_NAME" ]; then
            echo "ОШИБКА: нет файла $ZIP_NAME"
            ls -la
            exit 1
          fi

          echo "Найден архив: $ZIP_NAME"
          sha256sum "$ZIP_NAME"

          rm -rf .luma-src
          mkdir -p .luma-src
          python3 -c "import zipfile; zipfile.ZipFile('$ZIP_NAME').extractall('.luma-src')"

          # Ищем build.gradle
          if [ -f .luma-src/build.gradle ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE/.luma-src"
          else
            BUILD_GRADLE=$(find .luma-src -name build.gradle | head -1)
            if [ -z "$BUILD_GRADLE" ]; then
              echo "ОШИБКА: build.gradle не найден"
              find .luma-src -type f | head -40
              exit 1
            fi
            PROJECT_DIR=$(dirname "$BUILD_GRADLE")
            PROJECT_DIR=$(cd "$PROJECT_DIR" && pwd)
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project dir: $PROJECT_DIR"

          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/gradle.properties"
          test -f "$PROJECT_DIR/src/main/resources/fabric.mod.json"

          # Если нет wrapper.jar — скачиваем
          if [ ! -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Скачиваю gradle-wrapper.jar..."
            mkdir -p "$PROJECT_DIR/gradle/wrapper"
            curl -sL -o "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.jar" \
              "https://raw.githubusercontent.com/gradle/gradle/v8.12.0/gradle/wrapper/gradle-wrapper.jar"
          fi

          echo "Структура проекта OK"

      - name: Gradle build
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          chmod +x gradlew || true
          rm -rf build

          if [ -f ./gradlew ]; then
            ./gradlew --no-daemon clean build --stacktrace
          else
            gradle --no-daemon clean build --stacktrace
          fi

          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          archive_name=$(grep '^archives_base_name=' gradle.properties | cut -d= -f2 | tr -d '\r')
          jar="build/libs/\( {archive_name}- \){version}.jar"

          echo "Ищем JAR: $jar"
          ls -la build/libs/ || true
          test -s "$jar"

          mkdir -p "$RUNNER_TEMP/luma-artifact"
          cp "$jar" "$RUNNER_TEMP/luma-artifact/"
          echo "BUILD OK: $(basename $jar)" >> $GITHUB_STEP_SUMMARY

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: luma-visuals-0.1.6-jar
          path: ${{ runner.temp }}/luma-artifact/*
          if-no-files-found: error
